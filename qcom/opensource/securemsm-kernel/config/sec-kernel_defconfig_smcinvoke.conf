# timelm: smcinvoke_dlkm.ko for /dev/smcinvoke (ssgtzd; stock 4.19 had
# CONFIG_QCOM_SMCINVOKE=y).  On kona the Kbuild also force-includes
# sec-kernel_defconfig_qseecom.h, so smcinvoke leaves the qseecom kernel API
# to the built-in qseecom (drivers/misc/qseecom_qti).
export CONFIG_QCOM_SMCINVOKE=m
